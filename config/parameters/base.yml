parameters:
  project:
    name: mortgage-credit-risk

  logging:
    enabled: true
    level: INFO
    color: true

  reporting:
    skip: true

  data:
    data_provider: freddie_mac
    vintage: 2019
    id_col: "loan_id"
    time: "period"
    ingestion:
      skip: true
      chunksize: 2500000
    preprocess:
      skip: true 
  modelling:
    skip: true
    version: test
    vintages_train:
      - 2015
      - 2016
      - 2017
    vintages_oot:
      - 2018
      - 2019
    validation_size : 0.2
    random_state: 42
    stratify: true
    algorithm: logistic_regression
    logistic_regression:
      penalty: l2
      C: 1.0
      solver: lbfgs
      max_iter: 1000
      class_weight: balanced
  target:
    name : ever_90dpd_24m
    serious_delinquency_threshold: 3
    max_eligible_start_age: 1
    horizon_months: 24
    voluntary_payoffs_zbc: "01"


  evaluation:
    skip: false
    mode: existing_model  # same_run / existing_model same run will take the model from the current pipeline run

    model:
      version: test
      type: logistic_regression

    datasets:
      validation: true
      oot: true

    classification:
      threshold: 0.5

    risk:
      n_deciles: 10

    calibration:
      bins:
        - [0.00, 0.01]
        - [0.01, 0.02]
        - [0.02, 0.05]
        - [0.05, 0.10]
        - [0.10, 0.20]
        - [0.20, 0.50]
        - [0.50, 1.00]