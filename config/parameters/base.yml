parameters:

  # ============================================================
  # PROJECT
  # ============================================================

  project:
    name: mortgage-credit-risk

  modelling_approach: "behavioral" # origination / behavioral
  engine: "pyspark" # pyspark / pandas

  spark:
    master: local[28]
    driver_memory: 56g
    shuffle_partitions: 512

  # ============================================================
  # LOGGING
  # ============================================================

  logging:
    enabled: true
    level: INFO
    color: true

  # ============================================================
  # REPORTING
  # ============================================================

  reporting:
    skip: true

    # Vintage used for standalone reporting / QC analysis.
    vintage: 2015

  # ============================================================
  # DATA
  # ============================================================

  data:
    data_provider: freddie_mac

    # Vintages to ingest and preprocess.
    all_vintages:
    - 2015
    - 2016
    - 2017
    - 2018
    - 2019
    - 2020
    - 2021
    - 2022

    quarters: [ "Q1", "Q2", "Q3", "Q4" ]
    id_col: "loan_id"
    time: "period"

    ingestion:
      skip: true
      chunksize: 1500000
      performance_workers: 8

    preprocess:
      skip: true

      performance_batch_size: 100000

      features:

        # --------------------------------------------------------
        # Origination numerical features
        #
        # IMPORTANT:
        # These are the only numerical features passed to
        # build_origination_spark(). Performance fields must NOT
        # be placed here because they do not exist in the
        # origination dataframe.
        # --------------------------------------------------------

        numerical_features:
        - credit_score
        - original_dti
        - number_of_borrowers
        - original_ltv
        - original_cltv
        - mi_percentage
        - original_upb
        - original_interest_rate
        - original_loan_term
        # --------------------------------------------------------
        # Origination categorical features
        # --------------------------------------------------------

        categorical_features:
        - first_time_homebuyer_flag
        - property_type
        - occupancy_status
        - loan_purpose
        - channel
        - super_conforming_flag
        - harp_indicator
        - property_state

  # ============================================================
  # MODELLING
  # ============================================================

  modelling:
    skip: false
    use_existing_splits: true
    version: test_unbalanced_quarterly

    # ----------------------------------------------------------
    # Training / OOT vintage split
    # ----------------------------------------------------------

    vintages_train:
    - 2015
    - 2016
    - 2017
    - 2018
    - 2019
    - 2020

    vintages_test:
    - 2021
    vintages_oot:
    - 2022
    # ----------------------------------------------------------
    # Validation
    # ----------------------------------------------------------

    validation_size: 0.2
    random_state: 42
    train_test_split: "yearly"
    stratify: true

    # ----------------------------------------------------------
    # Model algorithm
    # ----------------------------------------------------------

    algorithm: xgboost

    lightgbm:
      n_estimators: 300
      max_depth: 4
      learning_rate: 0.05
      num_leaves: 15
      min_child_samples: 20
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0
      reg_lambda: 1
      objective: "binary"
      n_jobs: -1
      scale_pos_weight: 1.0
      random_state: 42

    random_forest:
      n_estimators: 300
      max_depth: 8
      min_samples_split: 10
      min_samples_leaf: 5
      max_features: "sqrt"
      bootstrap: true
      class_weight: null
      random_state: 42
      n_jobs: -1

    xgboost:
      tree_method: "hist"
      n_jobs: 16
      n_estimators: 1000
      max_depth: 5
      learning_rate: 0.03
      subsample: 0.8
      colsample_bytree: 0.7
      min_child_weight: 500
      reg_alpha: 1.0
      reg_lambda: 5.0
      eval_metric: "aucpr"
      scale_pos_weight: 1.0
      base_score: 0.01
      early_stopping_rounds: 150

      
    logistic_regression:
      penalty: l2
      C: 1.0
      solver: lbfgs
      max_iter: 1000
      class_weight: null

  # ============================================================
  # COMMON TARGET DEFINITIONS
  # ============================================================

  target:

    serious_delinquency_threshold: 3
    max_eligible_start_age: 1
    voluntary_payoffs_zbc: "01"

  # ============================================================
  # EVALUATION
  # ============================================================

  evaluation:
    skip: false

    # existing_model = evaluate an already persisted model
    # same_run      = evaluate the model produced in this run
    mode: existing_model

    model:
      version: test_unbalanced_quarterly
      type: xgboost

    threshold_selection:
      enabled: true
      optimisation_metric: f1
      candidate_thresholds_range: [ 0.01, 0.7 ]
      candidate_thresholds_step: 0.01
    datasets:
      validation: true
      oot: true

    shap:
      enabled: true

    # ----------------------------------------------------------
    # Classification threshold
    # ----------------------------------------------------------

    classification:
      threshold: 0.5

    # ----------------------------------------------------------
    # Risk decile configuration
    # ----------------------------------------------------------

    risk:
      n_deciles: 10

    # ----------------------------------------------------------
    # Calibration bins
    # ----------------------------------------------------------

    calibration:
      method: platt
      bins:
      - [ 0.00, 0.01 ]
      - [ 0.01, 0.02 ]
      - [ 0.02, 0.05 ]
      - [ 0.05, 0.10 ]
      - [ 0.10, 0.20 ]
      - [ 0.20, 0.50 ]
      - [ 0.50, 1.00 ]
