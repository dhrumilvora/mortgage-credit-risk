parameters:

  # ============================================================
  # FEATURE ENGINEERING
  # ============================================================

  feature_engineering:

    transformations:

      # --------------------------------------------------------
      # Credit score
      # --------------------------------------------------------

      credit_score:
        enabled: true
        method: bin

        bins:
        - 0
        - 580
        - 620
        - 660
        - 700
        - 740
        - 780
        - 850

        labels:
        - "<580"
        - "580-619"
        - "620-659"
        - "660-699"
        - "700-739"
        - "740-779"
        - "780+"

      # --------------------------------------------------------
      # Original UPB
      # --------------------------------------------------------

      original_upb:
        enabled: true
        method: log

      # --------------------------------------------------------
      # DTI
      # --------------------------------------------------------

      original_dti:
        enabled: true
        method: bin

        bins:
        - 0
        - 20
        - 30
        - 40
        - 50
        - 60
        - 100
        - inf

        labels:
        - "<20"
        - "20-29"
        - "30-39"
        - "40-49"
        - "50-59"
        - "60-99"
        - "100+"

      # --------------------------------------------------------
      # LTV
      # --------------------------------------------------------

      original_ltv:
        enabled: true
        method: bin

        bins:
        - 0
        - 60
        - 70
        - 75
        - 80
        - 85
        - 90
        - 95
        - 100
        - 150
        - inf

        labels:
        - "<60"
        - "60-69"
        - "70-74"
        - "75-79"
        - "80-84"
        - "85-89"
        - "90-94"
        - "95-99"
        - "100-149"
        - "150+"

      # --------------------------------------------------------
      # CLTV
      # --------------------------------------------------------

      original_cltv:
        enabled: true
        method: bin

        bins:
        - 0
        - 60
        - 70
        - 75
        - 80
        - 85
        - 90
        - 95
        - 100
        - 120
        - 150
        - inf

        labels:
        - "<60"
        - "60-69"
        - "70-74"
        - "75-79"
        - "80-84"
        - "85-89"
        - "90-94"
        - "95-99"
        - "100-119"
        - "120-149"
        - "150+"

  # ============================================================
  # MODELLING
  # ============================================================

  modelling:

    features:

      numerical_features:

      - number_of_borrowers
      - mi_percentage
      - original_upb
      - original_interest_rate
      - original_loan_term

      - original_upb_log

      categorical_features:

      - first_time_homebuyer_flag
      - property_type
      - occupancy_status
      - loan_purpose
      - channel
      - super_conforming_flag
      - harp_indicator
      - property_state

      - credit_score_bins
      - original_ltv_bins
      - original_cltv_bins
      - original_dti_bins

      engineered_features:

      - original_dti_missing

  # ============================================================
  # TARGET
  # ============================================================

  target:

    name: ever_90dpd_24m
    horizon_months: 24
