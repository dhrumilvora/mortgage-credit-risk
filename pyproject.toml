[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "mortgage-credit-risk"
version = "0.1.0"
description = "Production-grade mortgage credit risk modelling framework"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "shap>=0.46",
    "joblib>=1.4",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "jupyter>=1.1",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 100
target-version = "py311"
