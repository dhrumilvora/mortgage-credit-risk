[project]
name = "mortgage-credit-risk"
version = "0.1.0"
description = "Production-grade mortgage credit risk modelling framework"
authors = [
    { name = "Dhrumil Vora", email = "voradhrumil2002@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "joblib==1.5.3",
    "lightgbm==4.7.0",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "PyYAML==6.0.3",
    "pyspark==4.2.0",
    "scikit-learn==1.9.0",
    "scipy==1.18.1",
    "shap==0.52.0",
    "xgboost==3.4.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"